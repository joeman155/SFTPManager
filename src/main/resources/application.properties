# Application
spring.application.name=sftp-manager
server.port=8080

# GKE's HTTPS Load Balancer / Ingress terminates TLS and forwards to this pod
# over plain HTTP — without this, request.getScheme()/isSecure() see "http",
# so any relative sendRedirect() (e.g. AdminRoleFilter -> "/admin/denied")
# gets rebuilt by the container as an absolute http:// URL, which browsers
# then block as Mixed Content on an https:// page. This trusts the standard
# X-Forwarded-* headers so redirects (and secure-cookie flagging) are correct.
# Safe here because the Service is NodePort behind the LB only (see
# k8s/service.yaml) — same trust model RequestIp.java already relies on for
# X-Forwarded-For.
server.forward-headers-strategy=framework

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Logging
logging.level.com.sftpmanager=INFO
logging.level.org.springframework.security=WARN


# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# spring.security.oauth2.client.registration.google.scope=email,profile


# Google OAuth2 - Portal (regular users)
spring.security.oauth2.client.registration.google-portal.client-id=${GOOGLE_PORTAL_CLIENT_ID}
spring.security.oauth2.client.registration.google-portal.client-secret=${GOOGLE_PORTAL_CLIENT_SECRET}
spring.security.oauth2.client.registration.google-portal.scope=email,profile
spring.security.oauth2.client.registration.google-portal.provider=google
spring.security.oauth2.client.registration.google-portal.redirect-uri={baseUrl}/login/oauth2/code/google-portal

# Google OAuth2 - Admin
spring.security.oauth2.client.registration.google-admin.client-id=${GOOGLE_ADMIN_CLIENT_ID}
spring.security.oauth2.client.registration.google-admin.client-secret=${GOOGLE_ADMIN_CLIENT_SECRET}
spring.security.oauth2.client.registration.google-admin.scope=email,profile
spring.security.oauth2.client.registration.google-admin.provider=google
spring.security.oauth2.client.registration.google-admin.redirect-uri={baseUrl}/login/oauth2/code/google-admin

# Spring Session JDBC - share sessions across all pods via PostgreSQL
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=3600s
# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App base URL (used in email links)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail.from=${GMAIL_USERNAME}
# Support contact shown to users (e.g. on locked-account messages)
app.support-email=${SUPPORT_EMAIL:support@proficiens.io}
# Trial abuse guard: once this many accounts exist from one signup IP, further
# accounts from that IP are silently offered no free trial / grace period.
# FALLBACK ONLY — the live value is the "trialiplimit" row in runtime_settings
# (editable from the admin Runtime Settings page, takes effect immediately).
signup.trial-ip-limit=5
# Google reCAPTCHA v3
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}

# ── Payments (Stripe) ──────────────────────────────────────────────
# Leave keys empty = MOCK mode (no external calls, simulated payments).
# Test mode: use sk_test_... / pk_test_... keys from dashboard.stripe.com.
# Live mode: sk_live_... / pk_live_... keys AND the "billing.allow-live-charges"
# runtime setting = true (see below — that switch itself has moved).
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}

# All billing.* behaviour is now admin-editable at RUNTIME (Admin > Runtime
# Settings screen) instead of here — no deploy needed to change it, and env
# var overrides of these old property names are NO LONGER read at all.
# Seeded on first boot by DataInitialiser (see RuntimeConfigService for how
# the app reads them); shown here for reference only —
#   billing.enabled                     (default true)
#   billing.allow-live-charges          (default false — SAFETY: while false,
#                                         a live Stripe key can never charge)
#   billing.max-charge-cents            (default 50000 = $500 cap/charge)
#   billing.max-charges-per-user-per-day(default 2)
#   billing.max-charges-per-day         (default 50 — global runaway-loop guard)
#   billing.currency                    (default aud)
#   billing.scheduler.enabled           (default true)
#   billing.scheduler.dry-run           (default true — SAFETY: only LOGS
#                                         what would be charged until false)
